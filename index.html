<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOOM ACCESORIOS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: Arial, Helvetica, sans-serif;
background: #f8fbfd;
color: #17212b;
}

header {
position: sticky;
top: 0;
z-index: 1000;
background: white;
box-shadow: 0 2px 12px rgba(0,0,0,.08);
}

.top {
max-width: 1200px;
margin: auto;
padding: 15px 20px;
display: flex;
align-items: center;
gap: 20px;
justify-content: space-between;
}

.logo {
font-size: 25px;
font-weight: 800;
color: #65b7d8;
letter-spacing: 2px;
white-space: nowrap;
}

.logo span {
color: #d94b4b;
}

.search {
flex: 1;
max-width: 500px;
}

.search input {
width: 100%;
padding: 12px 16px;
border: 1px solid #d5e1e7;
border-radius: 25px;
outline: none;
font-size: 15px;
}

.cart-button {
border: none;
background: #65b7d8;
color: white;
padding: 11px 16px;
border-radius: 22px;
cursor: pointer;
font-weight: bold;
}

nav {
max-width: 1200px;
margin: auto;
padding: 0 20px 14px;
display: flex;
gap: 10px;
overflow-x: auto;
}

nav button {
border: none;
background: #eef7fa;
color: #245267;
padding: 9px 14px;
border-radius: 18px;
cursor: pointer;
white-space: nowrap;
}

nav button:hover {
background: #65b7d8;
color: white;
}

.hero {
max-width: 1200px;
margin: 25px auto;
padding: 55px 25px;
border-radius: 25px;
background: linear-gradient(135deg,#dff5fc,#fff);
text-align: center;
}

.hero h1 {
font-size: 42px;
color: #65b7d8;
margin-bottom: 10px;
}

.hero h1 span {
color: #d94b4b;
}

.hero p {
color: #56656d;
font-size: 17px;
}

.beta {
margin-top: 15px;
display: inline-block;
background: #d94b4b;
color: white;
padding: 6px 13px;
border-radius: 15px;
font-size: 12px;
font-weight: bold;
}

main {
max-width: 1200px;
margin: auto;
padding: 0 20px 50px;
}

.category {
margin-top: 45px;
scroll-margin-top: 150px;
}

.category h2 {
margin-bottom: 18px;
font-size: 26px;
color: #244858;
}

.grid {
display: grid;
grid-template-columns: repeat(auto-fill,minmax(210px,1fr));
gap: 20px;
}

.card {
background: white;
border-radius: 18px;
overflow: hidden;
box-shadow: 0 4px 15px rgba(0,0,0,.08);
transition: transform .2s;
}

.card:hover {
transform: translateY(-4px);
}

.card img {
width: 100%;
height: 220px;
object-fit: cover;
background: #eef4f6;
}

.card-content {
padding: 15px;
}

.card h3 {
font-size: 17px;
margin-bottom: 7px;
}

.tag {
display: inline-block;
background: #f5dede;
color: #a53838;
padding: 4px 8px;
border-radius: 10px;
font-size: 11px;
margin-bottom: 8px;
}

.price {
font-size: 20px;
font-weight: bold;
color: #65a9c5;
margin-bottom: 5px;
}

.stock {
font-size: 13px;
color: #65747c;
margin-bottom: 12px;
}

.add {
width: 100%;
border: none;
background: #65b7d8;
color: white;
padding: 11px;
border-radius: 10px;
cursor: pointer;
font-weight: bold;
}

.add:hover {
background: #4da4c8;
}

.empty {
text-align: center;
padding: 50px 20px;
color: #68777e;
}

footer {
background: #102f43;
color: white;
padding: 35px 20px;
text-align: center;
margin-top: 30px;
}

footer h3 {
margin-bottom: 8px;
}

.footer-buttons {
margin-top: 20px;
display: flex;
justify-content: center;
gap: 12px;
flex-wrap: wrap;
}

.footer-buttons a {
text-decoration: none;
color: white;
padding: 11px 18px;
border-radius: 20px;
background: #65b7d8;
font-weight: bold;
}

.footer-buttons a.instagram {
background: #d94b4b;
}

.modal {
position: fixed;
inset: 0;
background: rgba(0,0,0,.55);
display: none;
align-items: center;
justify-content: center;
z-index: 2000;
padding: 20px;
}

.modal.active {
display: flex;
}

.modal-box {
width: 100%;
max-width: 600px;
max-height: 90vh;
overflow-y: auto;
background: white;
border-radius: 20px;
padding: 25px;
}

.modal-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 20px;
}

.close {
border: none;
background: #eee;
width: 35px;
height: 35px;
border-radius: 50%;
cursor: pointer;
font-size: 18px;
}

.cart-item {
display: flex;
align-items: center;
gap: 12px;
padding: 12px 0;
border-bottom: 1px solid #eee;
}

.cart-item img {
width: 65px;
height: 65px;
border-radius: 10px;
object-fit: cover;
}

.cart-info {
flex: 1;
}

.qty {
display: flex;
align-items: center;
gap: 8px;
margin-top: 5px;
}

.qty button {
border: none;
width: 25px;
height: 25px;
border-radius: 50%;
cursor: pointer;
background: #e6f4f8;
}

.total {
text-align: right;
font-size: 22px;
font-weight: bold;
margin: 20px 0;
color: #244858;
}

.payment {
border-top: 1px solid #eee;
padding-top: 20px;
}

.bank {
background: #f5fafc;
padding: 13px;
border-radius: 10px;
margin: 8px 0;
}

.whatsapp {
width: 100%;
border: none;
background: #25d366;
color: white;
padding: 14px;
border-radius: 12px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
margin-top: 15px;
}

@media(max-width:700px) {
.top {
flex-wrap: wrap;
}

.search {
order: 3;
flex-basis: 100%;
max-width: none;
}

.hero h1 {
font-size: 32px;
}
}
</style>
</head>

<body>

<header>
<div class="top">
<div class="logo">BLOOM <span>ACCESORIOS</span></div>

<div class="search">
<input
type="text"
id="search"
placeholder="Buscar accesorios..."
>
</div>

<button class="cart-button" onclick="openCart()">
🛒 Carrito (<span id="cartCount">0</span>)
</button>
</div>

<nav>
<button onclick="goToCategory('cristiana')">Colección Cristiana</button>
<button onclick="goToCategory('hombre')">Colección de Hombre</button>
<button onclick="goToCategory('honduras')">Colección de Honduras 🇭🇳</button>
<button onclick="goToCategory('collares')">Collares</button>
<button onclick="goToCategory('pulseras')">Pulseras</button>
<button onclick="goToCategory('anillos')">Anillos</button>
</nav>
</header>

<section class="hero">
<h1>BLOOM <span>ACCESORIOS</span></h1>
<p>Detalles que representan tu estilo</p>
<span class="beta">BETA 5.1</span>
</section>

<main id="products"></main>

<footer>
<h3>BLOOM ACCESORIOS</h3>
<p>Gracias por comprar con nosotros ❤️</p>

<div class="footer-buttons">
<a href="https://wa.me/50494439739" target="_blank">
💬 WhatsApp
</a>

<a
class="instagram"
href="https://instagram.com/BLOOMACCESORIOS"
target="_blank"
>
📸 Instagram
</a>
</div>
</footer>

<div class="modal" id="cartModal">
<div class="modal-box">

<div class="modal-header">
<h2>🛒 Tu carrito</h2>
<button class="close" onclick="closeCart()">×</button>
</div>

<div id="cartItems"></div>

<div class="total">
Total: L <span id="cartTotal">0.00</span>
</div>

<div class="payment">
<h3>Información de pago</h3>
<p style="margin:8px 0 12px;">
Realiza tu transferencia a una de las siguientes cuentas:
</p>

<div id="banks"></div>

<button class="whatsapp" onclick="sendOrder()">
Confirmar pedido por WhatsApp
</button>
</div>

</div>
</div>

<script>
const SUPABASE_URL = "https://fpoommdbqjyxbtdbsyxg.supabase.co";
const SUPABASE_KEY = "sb_publishable_OMtcLm4g7uBAvUI0VYv_qg_gs5oF9Cr";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let products = [];
let banks = [];
let cart = [];

const categories = [
{
id: "cristiana",
title: "Colección Cristiana",
collection: "Colección Cristiana"
},
{
id: "hombre",
title: "Colección de Hombre",
collection: "Colección de Hombre"
},
{
id: "honduras",
title: "Colección de Honduras 🇭🇳",
collection: "Colección de Honduras"
},
{
id: "collares",
title: "Collares",
category: "Collares"
},
{
id: "pulseras",
title: "Pulseras",
category: "Pulseras"
},
{
id: "anillos",
title: "Anillos",
category: "Anillos"
}
];

async function loadProducts() {
const { data, error } =
await supabaseClient
.from("products")
.select("*")
.eq("active", true)
.gt("stock", 0)
.order("created_at", { ascending: false });

if (error) {
console.error(error);
document.getElementById("products").innerHTML =
'<div class="empty">No se pudieron cargar los productos.</div>';
return;
}

products = data || [];
renderProducts();
updateCart();
}

async function loadBanks() {
const { data, error } =
await supabaseClient
.from("bank_accounts")
.select("*")
.eq("active", true)
.order("created_at", { ascending: true });

if (error) {
console.error(error);
return;
}

banks = data || [];
renderBanks();
}

function renderBanks() {
const box = document.getElementById("banks");

if (!banks.length) {
box.innerHTML =
"<p>No hay cuentas bancarias disponibles.</p>";
return;
}

box.innerHTML = banks.map(bank => `
<div class="bank">
<strong>${escapeHtml(bank.bank)}</strong><br>
${escapeHtml(bank.account_type || "")}<br>
Cuenta: ${escapeHtml(bank.account_number)}<br>
${bank.account_holder
? "Titular: " + escapeHtml(bank.account_holder)
: ""}
</div>
`).join("");
}

function renderProducts() {
const container =
document.getElementById("products");

const search =
document.getElementById("search").value
.toLowerCase()
.trim();

if (!products.length) {
container.innerHTML =
'<div class="empty">No hay productos disponibles.</div>';
return;
}

let html = "";

categories.forEach(cat => {
let list = products.filter(product => {
const categoryMatch =
cat.category
? product.category === cat.category
: product.collection === cat.collection;

const searchMatch =
!search ||
product.name.toLowerCase().includes(search) ||
product.category.toLowerCase().includes(search) ||
product.collection.toLowerCase().includes(search);

return categoryMatch && searchMatch;
});

if (!list.length) return;

html += `
<section class="category" id="${cat.id}">
<h2>${cat.title}</h2>
<div class="grid">
${list.map(card).join("")}
</div>
</section>
`;
});

if (!html) {
html =
'<div class="empty">No encontramos productos para tu búsqueda.</div>';
}

container.innerHTML = html;
}

function card(product) {
return `
<article class="card">
<img
src="${escapeHtml(product.image || "")}"
alt="${escapeHtml(product.name)}"
>

<div class="card-content">
${product.tag
? `<span class="tag">${escapeHtml(product.tag)}</span>`
: ""}

<h3>${escapeHtml(product.name)}</h3>

<div class="price">
L ${Number(product.price).toFixed(2)}
</div>

<div class="stock">
Disponibles: ${product.stock}
</div>

<button
class="add"
onclick="addToCart(${product.id})"
>
Agregar al carrito
</button>
</div>
</article>
`;
}

function escapeHtml(value) {
return String(value ?? "")
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");
}
unction addToCart(id) {
const product = products.find(p => p.id === id);

if (!product || product.stock <= 0) return;

const existing = cart.find(item => item.id === id);

if (existing) {
if (existing.quantity >= product.stock) {
alert("No hay más unidades disponibles.");
return;
}

existing.quantity++;
} else {
cart.push({
id: product.id,
name: product.name,
price: Number(product.price),
image: product.image,
quantity: 1
});
}

updateCart();
}

function removeFromCart(id) {
cart = cart.filter(item => item.id !== id);
updateCart();
}

function changeQuantity(id, amount) {
const item = cart.find(i => i.id === id);
const product = products.find(p => p.id === id);

if (!item || !product) return;

item.quantity += amount;

if (item.quantity <= 0) {
removeFromCart(id);
return;
}

if (item.quantity > product.stock) {
item.quantity = product.stock;
alert("No puedes agregar más unidades de las disponibles.");
}

updateCart();
}

function updateCart() {
const count =
cart.reduce((sum, item) => sum + item.quantity, 0);

document.getElementById("cartCount").textContent = count;

const container =
document.getElementById("cartItems");

if (!cart.length) {
container.innerHTML =
'<div class="empty">Tu carrito está vacío.</div>';

document.getElementById("cartTotal").textContent =
"0.00";

return;
}

let total = 0;

container.innerHTML = cart.map(item => {
const product = products.find(p => p.id === item.id);

if (product) {
if (product.stock <= 0) {
return "";
}

if (item.quantity > product.stock) {
item.quantity = product.stock;
}
}

const subtotal =
item.price * item.quantity;

total += subtotal;

return `
<div class="cart-item">

<img
src="${escapeHtml(item.image || "")}"
alt="${escapeHtml(item.name)}"
>

<div class="cart-info">
<strong>${escapeHtml(item.name)}</strong>

<div>
L ${item.price.toFixed(2)}
</div>

<div class="qty">
<button
onclick="changeQuantity(${item.id}, -1)"
>
−
</button>

<span>${item.quantity}</span>

<button
onclick="changeQuantity(${item.id}, 1)"
>
+
</button>

<button
onclick="removeFromCart(${item.id})"
style="margin-left:8px;"
>
🗑️
</button>
</div>
</div>

<strong>
L ${subtotal.toFixed(2)}
</strong>

</div>
`;
}).join("");

document.getElementById("cartTotal").textContent =
total.toFixed(2);
}

function openCart() {
document
.getElementById("cartModal")
.classList.add("active");

updateCart();
renderBanks();
}

function closeCart() {
document
.getElementById("cartModal")
.classList.remove("active");
}

function goToCategory(id) {
const section =
document.getElementById(id);

if (section) {
section.scrollIntoView({
behavior: "smooth",
block: "start"
});
}
}

function sendOrder() {
if (!cart.length) {
alert("Tu carrito está vacío.");
return;
}

let message =
"Hola BLOOM ACCESORIOS 👋%0A%0A";

message +=
"Quiero confirmar el siguiente pedido:%0A%0A";

let total = 0;

cart.forEach(item => {
const product =
products.find(p => p.id === item.id);

if (!product || product.stock <= 0) return;

const subtotal =
item.price * item.quantity;

total += subtotal;

message +=
`• ${item.name} x${item.quantity} = L ${subtotal.toFixed(2)}%0A`;
});

message +=
`%0A💰 Total: L ${total.toFixed(2)}%0A%0A`;

message +=
"Quedo pendiente para enviar el comprobante de pago. Gracias ❤️";

const url =
"https://wa.me/50494439739?text=" +
encodeURIComponent(
message
.replaceAll("%0A", "\n")
);

window.open(url, "_blank");
}

document
.getElementById("search")
.addEventListener("input", renderProducts);

document
.getElementById("cartModal")
.addEventListener("click", function(e) {
if (e.target === this) {
closeCart();
}
});

async function startRealtime() {
supabaseClient
.channel("bloom-products")
.on(
"postgres_changes",
{
event: "*",
schema: "public",
table: "products"
},
async () => {
await loadProducts();
}
)
.subscribe();

supabaseClient
.channel("bloom-banks")
.on(
"postgres_changes",
{
event: "*",
schema: "public",
table: "bank_accounts"
},
async () => {
await loadBanks();
}
)
.subscribe();
}

async function init() {
await loadProducts();
await loadBanks();
startRealtime();
}

init();

</script>

</body>
</html>
