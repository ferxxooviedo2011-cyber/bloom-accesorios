<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLOOM — Administración</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#dcebfa;--dark:#29445f;--red:#d91f26}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f9fd;color:var(--dark)}header{background:var(--dark);color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:auto;padding:22px}.box{background:#fff;border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 4px 16px #0001}input,select{width:100%;padding:11px;border:1px solid #ccd9e5;border-radius:9px;margin:5px 0}button{border:0;border-radius:9px;padding:10px 13px;background:var(--dark);color:#fff;font-weight:bold;cursor:pointer;margin:3px}.danger{background:var(--red)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.row{border-bottom:1px solid #ddd;padding:15px 0}.preview{width:100px;height:100px;object-fit:cover;border-radius:12px;background:var(--blue);display:block;margin:7px 0}.alert{background:#fff0f0;border:1px solid #e44;padding:11px;border-radius:10px;margin-bottom:8px}.login{max-width:400px;margin:60px auto}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><b>BLOOM ACCESORIOS — ADMIN</b><button onclick="logout()">Cerrar sesión</button></header>
<section id="login" class="login box"><h2>Administrador</h2><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button onclick="login()">Entrar</button><p id="msg"></p></section>
<main id="app" class="wrap" style="display:none">
<div id="alerts"></div>
<section class="box"><h2>➕ Nuevo producto</h2><div class="grid"><input id="name" placeholder="Nombre"><input id="category" placeholder="Categoría exacta"><input id="collection" placeholder="Colección"><input id="price" type="number" step=".01" placeholder="Precio"><input id="stock" type="number" placeholder="Stock"><input id="threshold" type="number" value="2" placeholder="Stock mínimo"><input id="tag" placeholder="Etiqueta"></div><label>Imagen del producto</label><input id="file" type="file" accept="image/*" onchange="previewNew()"><img id="newPreview" class="preview" style="display:none"><button onclick="addProduct()">Guardar producto</button></section>
<section class="box"><h2>📦 Inventario</h2><div id="products"></div></section>
<section class="box"><h2>💳 Cuentas bancarias</h2><div class="grid"><input id="bank" placeholder="Banco"><input id="type" placeholder="Tipo de cuenta"><input id="number" placeholder="Número de cuenta"><input id="holder" placeholder="Titular"></div><button onclick="addBank()">Agregar cuenta</button><div id="banks"></div></section>
</main>
<script>
const DB_URL="https://fpoommdbqjyxbtdbsyxg.supabase.co",DB_KEY="sb_publishable_OMtcLm4g7uBAvUI0VYv_qg_gs5oF9Cr";const db=supabase.createClient(DB_URL,DB_KEY);let products=[],banks=[];
const esc=s=>(s??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function login(){let {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error)return msg.textContent=error.message;start()}
async function start(){let {data:{user}}=await db.auth.getUser();if(!user)return;let a=await db.from("admins").select("user_id").eq("user_id",user.id).maybeSingle();if(a.error||!a.data){await db.auth.signOut();return alert("Este usuario no está autorizado.");}loginEl(false);load()}
function loginEl(show){document.getElementById("login").style.display=show?"block":"none";document.getElementById("app").style.display=show?"none":"block"}
async function load(){let p=await db.from("products").select("*").order("created_at",{ascending:false}),b=await db.from("bank_accounts").select("*").order("created_at",{ascending:false});if(p.error)alert(p.error.message);products=p.data||[];banks=b.data||[];render()}
function render(){alerts.innerHTML=products.filter(p=>p.stock<=p.low_stock_threshold).map(p=>`<div class="alert">⚠️ <b>${esc(p.name)}</b>: quedan ${p.stock} unidades.</div>`).join("");document.getElementById("products").innerHTML=products.map(p=>`<div class="row"><b>${esc(p.name)}</b><br><small>${esc(p.category)} · ${p.active?"Visible":"Oculto"}</small>${p.image?`<img class="preview" src="${esc(p.image)}">`:""}<div class="grid"><label>Precio<input type="number" step=".01" value="${p.price}" onchange="upd(${p.id},{price:Number(this.value)})"></label><label>Stock<input type="number" value="${p.stock}" onchange="upd(${p.id},{stock:Number(this.value)})"></label></div><input type="file" accept="image/*" onchange="replaceImage(${p.id},this)"><button onclick="upd(${p.id},{active:${!p.active}})">${p.active?"Ocultar":"Mostrar"}</button><button class="danger" onclick="delProduct(${p.id})">Eliminar</button></div>`).join("")||"<p>No hay productos.</p>";document.getElementById("banks").innerHTML=banks.map(b=>`<div class="row"><b>${esc(b.bank)}</b><br>${esc(b.account_type||"Cuenta")} · ${esc(b.account_number)}<br>${esc(b.account_holder||"")}<br><button class="danger" onclick="delBank(${b.id})">Eliminar</button></div>`).join("")}
async function upload(file){if(!file)return null;if(file.size>5*1024*1024)throw Error("La imagen debe pesar menos de 5 MB.");let ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");let path=`${crypto.randomUUID()}.${ext}`;let r=await db.storage.from("product-images").upload(path,file,{upsert:false,contentType:file.type});if(r.error)throw r.error;return db.storage.from("product-images").getPublicUrl(path).data.publicUrl}
function previewNew(){let f=file.files[0];if(!f)return;newPreview.src=URL.createObjectURL(f);newPreview.style.display="block"}
async function addProduct(){try{let image=await upload(file.files[0]);let obj={name:name.value.trim(),category:category.value.trim(),collection:collection.value.trim(),price:Number(price.value)||0,stock:Number(stock.value)||0,low_stock_threshold:Number(threshold.value)||2,image,tag:tag.value.trim()||null,active:true};if(!obj.name||!obj.category||!obj.collection)return alert("Completa nombre, categoría y colección.");let r=await db.from("products").insert(obj);if(r.error)throw r.error;["name","category","collection","price","stock","tag"].forEach(x=>document.getElementById(x).value="");file.value="";newPreview.style.display="none";load()}catch(e){alert("No se pudo guardar: "+e.message)}}
async function replaceImage(id,input){try{let url=await upload(input.files[0]);if(url)await upd(id,{image:url})}catch(e){alert("No se pudo subir: "+e.message)}}
async function upd(id,changes){let r=await db.from("products").update(changes).eq("id",id);if(r.error)alert(r.error.message);else load()}
async function delProduct(id){if(!confirm("¿Eliminar producto?"))return;let r=await db.from("products").delete().eq("id",id);if(r.error)alert(r.error.message);else load()}
async function addBank(){let obj={bank:bank.value.trim(),account_type:type.value.trim(),account_number:number.value.trim(),account_holder:holder.value.trim(),active:true};if(!obj.bank||!obj.account_number)return alert("Completa banco y número.");let r=await db.from("bank_accounts").insert(obj);if(r.error)alert(r.error.message);else{["bank","type","number","holder"].forEach(x=>document.getElementById(x).value="");load()}}
async function delBank(id){if(!confirm("¿Eliminar cuenta?"))return;let r=await db.from("bank_accounts").delete().eq("id",id);if(r.error)alert(r.error.message);else load()}
async function logout(){await db.auth.signOut();location.reload()}
db.auth.getSession().then(({data})=>{if(data.session)start()});db.channel("admin-live").on("postgres_changes",{event:"*",schema:"public",table:"products"},load).subscribe();
</script>
</body></html>
